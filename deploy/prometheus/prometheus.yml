# telling Prometheus to scrape your server's /metrics endpoint every 15s, scraping from cadvisor:8080 for CPU and memory metrics.
scrape_configs:
  - job_name: 'medragassistant'
    scrape_interval: 15s
    static_configs:
      - targets: ['server:8000']
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']