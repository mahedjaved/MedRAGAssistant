version: "3.9"
volumes:
  qdrant_data:
  postgres_data:
  hf_cache:
networks:
  medrag-network:
    driver: bridge

# Service 1: Qdrant - hosts our vector store
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - medrag-network
  
# Service 2: PostgresSQL - hosts our DB
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medrag-network

# The Server 
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - postgres
    networks:
      - medrag-network

# The Client
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://server:8000
    depends_on:
      - server
    networks:
      - medrag-network

#  add Prometheus service (port 9090) and Grafana service (port 3000) with volumes pointing at the config files
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - medrag-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/dashboards/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./deploy/grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./deploy/grafana/dashboards/medrag_dashboard.json:/etc/grafana/provisioning/dashboards/medrag_dashboard.json
    networks:
      - medrag-network

  # For CPU and memory monitoring we use cAdvisor.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - medrag-network
    