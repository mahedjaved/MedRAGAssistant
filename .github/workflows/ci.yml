name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
defaults:
  run:
    shell: bash
# --------------------------------------- #
#  JOB 1: LINTING -- Flake8 for linting
# --------------------------------------- #
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --no-cache-dir -r server/requirements.txt -r client/requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 server/ client/ --count --select=E9,F63,F7,F82 --show-source --statistics
# --------------------------------------- #
#  JOB 2: TEST -- PyTest for testing
# --------------------------------------- #
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --no-cache-dir -r server/requirements.txt -r client/requirements.txt
      - name: Run tests
        run: |
          pip install pytest httpx
          pytest tests/ -v
# --------------------------------------- #
#  JOB 3: BUILD -- Docker build
# --------------------------------------- #
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server Docker image
        run: docker build -f server/Dockerfile -t medrag-server .
      - name: Build client Docker image
        run: docker build -f client/Dockerfile -t medrag-client .
# ------------------------------------------- #
#  JOB 4: EVALUATION -- RAGAS evaluation suite
# ------------------------------------------- #
  evaluation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --no-cache-dir -r server/requirements.txt
      - name: Run RAGAS evaluation
        run: |
          python scripts/run_evaluation.py
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      - name: Check evaluation scores
        run: |
          # Fail if any metric is below threshold (baseline: 0.5)
          python -c "
          import json, sys
          from pathlib import Path
          reports = sorted(Path('eval_reports').glob('eval_*.json'))
          if not reports:
              print('No evaluation reports found')
              sys.exit(1)
          latest = json.loads(reports[-1].read_text())
          for metric, score in latest['scores'].items():
              if score < 0.5:
                  print(f'FAIL: {metric} = {score:.4f} < 0.5 threshold')
                  sys.exit(1)
              print(f'PASS: {metric} = {score:.4f}')
          "

# ------------------------------------------- #
#  JOB 5: DEPLOY -- Deploy via Render/Fly.io
# ------------------------------------------- #
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, evaluation]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy placeholder
        run: echo "Deployment to Render/Fly.io goes here once configured"